<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>·</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    min-height:100vh;
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 24px;
    -webkit-font-smoothing:antialiased;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(10, 1fr);
    gap:10px;
    width:100%;
    max-width:780px;
  }

  .btn{
    aspect-ratio:1 / 1;
    display:grid;
    place-items:center;
    background:#0a0a0a;
    border:1px solid #1a1a1a;
    border-radius:10px;
    color:#5a5a5a;
    font-size:13px;
    font-family:inherit;
    font-weight:400;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
  }

  .btn:hover{
    background:#141414;
    border-color:#2b2b2b;
    color:#8f8f8f;
  }

  .btn:active{transform:scale(.94);}

  .btn:focus-visible{
    outline:1px solid #333;
    outline-offset:2px;
  }

  @media (max-width:640px){
    .grid{grid-template-columns:repeat(6, 1fr);gap:8px;}
    .btn{font-size:12px;border-radius:8px;}
  }

  @media (max-width:380px){
    .grid{grid-template-columns:repeat(5, 1fr);}
  }
</style>
</head>
<body>

  <div class="grid" id="grid"></div>

<script>
(function () {
  'use strict';

  /* ====== 这里配置：哪个数字跳转到哪个页面 ====== */
  const PAGES = {
    34: 'next.html',      // 34 跳转到摩斯电码+下载页
    58: 'secret.html'     // 58 跳转到密码页（请改成你实际的文件名）
  };

  const TOTAL = 100;      // 按钮总数

  /* ============================================= */

  const grid = document.getElementById('grid');
  const frag = document.createDocumentFragment();

  for (let i = 1; i <= TOTAL; i++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.textContent = i;
    btn.setAttribute('aria-label', String(i));

    // 如果当前编号在 PAGES 里有配置，就绑定跳转
    if (PAGES[i]) {
      btn.addEventListener('click', function () {
        window.location.href = PAGES[i];
      });
    }

    frag.appendChild(btn);
  }

  grid.appendChild(frag);
})();
</script>
</body>
</html>
